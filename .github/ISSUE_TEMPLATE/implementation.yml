name: Implementation task
description: Track focused MVP implementation or setup work.
title: "[MVP] "
labels:
  - mvp
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this issue is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Keep this focused. Link related issues instead of expanding this one.
    validations:
      required: true
  - type: checkboxes
    id: source-of-truth
    attributes:
      label: Source-of-truth checks
      options:
        - label: Aligns with docs/live-translate-build-spec.md.
        - label: Updates README if setup, architecture, behavior, issue status, verification, or risks change.
        - label: For UI work, aligns with docs/mockup-ux-spec.md and assets/mockups.
        - label: Does not drift from accepted decisions without updating docs/decision-log.md.
        - label: Keeps V2/cloud/backend/auth scope in docs/v2-future-scope.md unless explicitly accepted into MVP.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy, security, and cybersecurity guardrails
      options:
        - label: No standard OpenAI API key in mobile source/config/assets/tests/screenshots/build outputs.
        - label: MVP remains phone-only aside from direct OpenAI API calls.
        - label: No AWS, Lambda, token broker, app backend, cloud sync, server mailer, or server-side transcript handling added to MVP.
        - label: Transcript/audio/prompt/summary/export/recipient content is not sent to app-owned backend infrastructure.
        - label: Logs, analytics, diagnostics, crash reports, screenshots, and tests redact secrets and exclude sensitive payloads.
        - label: Dependency/package and permission changes include cybersecurity review where applicable.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete checks required before closing.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands, emulator checks, cybersecurity checks, or manual verification expected.
      value: |
        -
