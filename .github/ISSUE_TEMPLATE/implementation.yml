name: Implementation task
description: Track focused MVP implementation or setup work.
title: "[MVP] "
labels:
  - mvp
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this issue is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Keep this focused. Link related issues instead of expanding this one.
    validations:
      required: true
  - type: checkboxes
    id: source-of-truth
    attributes:
      label: Source-of-truth checks
      options:
        - label: Aligns with docs/live-translate-build-spec.md.
        - label: Updates README if setup, architecture, behavior, issue status, verification, or risks change.
        - label: For UI work, aligns with docs/mockup-ux-spec.md and assets/mockups.
        - label: Does not drift from accepted decisions without updating docs/decision-log.md.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and security guardrails
      options:
        - label: No standard OpenAI API key in mobile source/config/assets/tests/build outputs.
        - label: AWS remains a token broker only.
        - label: Transcript/audio content is not sent to AWS.
        - label: Logs and diagnostics redact secrets and exclude transcript/audio payloads.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete checks required before closing.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands, emulator checks, or manual verification expected.
      value: |
        -
